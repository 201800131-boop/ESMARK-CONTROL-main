name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-sign-and-release:
    runs-on: windows-latest
    env:
      GH_OWNER: ${{ github.repository_owner }}
      GH_REPO: ${{ github.event.repository.name }}
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (monorepo root)
        run: npm.cmd install --include=optional

      - name: Install dependencies in Windows workspace
        working-directory: apps/windows
        run: npm.cmd install --include=optional

      - name: Install 7-Zip on runner
        run: choco install 7zip -y

      - name: Ensure 7zip-bin is available
        run: npm.cmd install 7zip-bin --no-save

      - name: Prepare local 7za binary for electron-builder
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files\7-Zip\7za.exe",
            "C:\Program Files\7-Zip\7z.exe",
            "C:\ProgramData\chocolatey\bin\7za.exe",
            "C:\ProgramData\chocolatey\bin\7z.exe"
          )

          $sevenZipExe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $sevenZipExe) {
            throw "No se encontró un ejecutable de 7-Zip en el runner"
          }

          $targetDir = "node_modules/7zip-bin/win/x64"
          New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
          Copy-Item -Path $sevenZipExe -Destination (Join-Path $targetDir "7za.exe") -Force
          Copy-Item -Path $sevenZipExe -Destination (Join-Path $targetDir "7za") -Force

      - name: Build installer (unsigned)
        working-directory: apps/windows
        run: npm.cmd run electron:build

      - name: Upload unsigned installer to GitHub artifact
        id: upload_unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer-${{ github.run_id }}
          path: apps/windows/release/ESMARK-Control-Setup-*.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Sign installer with SignPath
        id: signpath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: initial-version
          github-artifact-id: ${{ steps.upload_unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: apps/windows/release/signed
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace unsigned installer with signed one
        shell: pwsh
        run: |
          $signedExe = Get-ChildItem "apps/windows/release/signed" -Recurse -Filter "*.exe" | Select-Object -First 1
          if (-not $signedExe) {
            throw "No signed .exe found in apps/windows/release/signed"
          }
          $version = (Get-Content "apps/windows/package.json" -Raw | ConvertFrom-Json).version
          $target = "apps/windows/release/ESMARK-Control-Setup-$version.exe"
          Copy-Item -Path $signedExe.FullName -Destination $target -Force

      - name: Refresh update metadata for signed installer
        working-directory: apps/windows
        run: node scripts/refresh-latest-yml.cjs

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/windows/release/ESMARK-Control-Setup-*.exe
            apps/windows/release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
